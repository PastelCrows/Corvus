# Sized to fit the built UKI (Unified Kernel Image), which on a real build
# came out at ~565M — bloated by the generic (hostonly=no) initrd bundling
# firmware for effectively every driver, not just what's needed pre-root.
# GPU/wifi firmware doesn't need to be in the initrd at all — it loads
# on-demand from the real root well after boot. Tracked in image/README.md
# as a follow-up; sized generously here in the meantime rather than block
# on that tuning work.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
SizeMinBytes=1024M
SizeMaxBytes=1024M
