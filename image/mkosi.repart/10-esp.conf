# Sized to fit the built UKI (Unified Kernel Image), which on a real build
# came out at ~565M — bloated by the generic (hostonly=no) initrd bundling
# firmware for effectively every driver, not just what's needed pre-root.
# GPU/wifi firmware doesn't need to be in the initrd at all — it loads
# on-demand from the real root well after boot. Tracked in image/README.md
# as a follow-up; sized generously here in the meantime rather than block
# on that tuning work.
# Both CopyFiles= lines are required (this is mkosi's own documented default
# ESP definition). /boot holds the UKI; /efi holds the systemd-boot loader
# binaries (EFI/BOOT/BOOTX64.EFI, EFI/systemd/systemd-bootx64.efi) that
# earlier only existed inside the built rootfs, never on the actual ESP
# partition, because this file was missing the /efi line — the real reason
# firmware found nothing bootable, independent of the Ephemeral/NVRAM fix.
[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=1024M
SizeMaxBytes=1024M
