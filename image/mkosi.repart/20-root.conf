# Root filesystem. See docs/SCOPE.md §4 (atomic image + btrfs snapshot
# rollback) and §15 (user-data backup distinct from OS-image rollback).
#
# /home and /var/log are split into their own subvolumes so that rolling
# back the OS image (rollback of the top-level/@ subvolume) does not touch
# user files or logs — image rollback and user-data snapshots
# (update-system/, Phase 10) are deliberately independent mechanisms
# operating on different subvolumes.
#
# NOTE: unlike mkosi's own .conf files, systemd-repart.d config is a plain
# systemd unit-file-style parser: multi-value settings need the key repeated
# per line, not mkosi's indented-continuation style (that was silently
# dropped with "Missing '=', ignoring line" on a real build).
[Partition]
Type=root
Format=btrfs
CopyFiles=/
Minimize=guess
Subvolumes=/home
Subvolumes=/var/log
