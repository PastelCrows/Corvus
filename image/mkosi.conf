[Distribution]
Distribution=arch
Architecture=x86-64

# mkosi builds its own self-contained set of build tools (cpio, mtools,
# dosfstools, python-pefile for ukify, etc.) instead of relying on whatever
# happens to be installed on the build host. Avoids the host-dependency
# whack-a-mole this project's whole update model exists to design out — see
# docs/SCOPE.md §4. Costs extra time/network on first build only.
[Host]
ToolsTree=default

# Without this, `mkosi qemu`/`mkosi boot` reuse the same persistent UEFI
# firmware variable store across every invocation, so OVMF boot-entry state
# (including stale/broken entries from earlier runs against an older,
# broken build) accumulates indefinitely instead of resetting. Ephemeral
# gives every boot-test run a disposable snapshot + fresh firmware state.
Ephemeral=yes

[Output]
Format=disk
Output=corvus
OutputDirectory=mkosi.output

# Compression and split partition artifacts are a distribution-time concern
# (mkosi's own docs: compression makes shell/boot/qemu "not available";
# split artifacts are for A/B update scenarios — Phase 10, update-system/).
# Neither belongs here while Phase 1 is just proving the image boots.
# Revisit both when update-system/ actually needs them.
CompressOutput=no

# Required for mkosi.repart/20-root.conf's Subvolumes= to actually do
# anything: per mkosi's own docs, subvolumes cannot be created without
# loopback devices, and RepartOffline defaults to enabled (no loopback).
# Without this, /home and /var/log were never really being split into their
# own subvolumes — the disk still booted fine either way, so this was a
# silent correctness bug, not something boot-testing would ever surface.
RepartOffline=no

[Content]
Bootable=yes
Bootloader=systemd-boot
Locale=en_US.UTF-8
Timezone=UTC
Hostname=corvus

# Root account is locked at build time. The real account is created by the
# graphical installer (see ../installer), not baked into the base image.
RootPassword=hashed:!

[Build]
Environment=SYSTEMD_LOG_LEVEL=info
