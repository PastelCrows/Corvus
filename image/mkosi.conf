[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
Format=disk
Output=corvus
OutputDirectory=mkosi.output
CompressOutput=zstd
SplitArtifacts=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
Locale=en_US.UTF-8
Timezone=UTC
Hostname=corvus

# Root account is locked at build time. The real account is created by the
# graphical installer (see ../installer), not baked into the base image.
RootPassword=hashed:!

[Build]
Environment=SYSTEMD_LOG_LEVEL=info
