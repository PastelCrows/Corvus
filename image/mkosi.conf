[Distribution]
Distribution=arch
Architecture=x86-64

# mkosi builds its own self-contained set of build tools (cpio, mtools,
# dosfstools, python-pefile for ukify, etc.) instead of relying on whatever
# happens to be installed on the build host. Avoids the host-dependency
# whack-a-mole this project's whole update model exists to design out — see
# docs/SCOPE.md §4. Costs extra time/network on first build only.
[Host]
ToolsTree=default

[Output]
Format=disk
Output=corvus
OutputDirectory=mkosi.output
CompressOutput=zstd
SplitArtifacts=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
Locale=en_US.UTF-8
Timezone=UTC
Hostname=corvus

# Root account is locked at build time. The real account is created by the
# graphical installer (see ../installer), not baked into the base image.
RootPassword=hashed:!

[Build]
Environment=SYSTEMD_LOG_LEVEL=info
