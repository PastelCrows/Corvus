# GPU drivers bundled into the base image itself, not a post-install step.
# See docs/SCOPE.md §6. Covers all three vendors up front since target
# hardware is unknown at build time; hardware/ (Phase 3) is responsible for
# detecting which one actually applies at boot.
#
# nvidia-open-dkms builds against `linux-headers` at image-build time, so it
# stays in lockstep with the pinned `linux` package version from
# 10-base-packages.conf without needing a separate matched nvidia package.
[Content]
Packages=
        mesa
        vulkan-icd-loader
        vulkan-radeon
        xf86-video-amdgpu
        vulkan-intel
        intel-media-driver
        linux-headers
        nvidia-open-dkms
        nvidia-utils
