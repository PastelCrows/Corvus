# Root is discovered via the Discoverable Partitions Spec (GPT type UUIDs set
# in mkosi.repart/), so no root= is needed on the command line.

# The actual fix for the ~565M oversized UKI. Per mkosi's own docs:
# FirmwareFiles= says firmware dependencies of included kernel modules are
# automatically pulled in, and with no KernelInitrdModules= set, the
# per-kernel modules+firmware initrd was defaulting to essentially every
# module the kernel package ships (and therefore its firmware) - none of
# which is needed before root is even mounted. `default` uses mkosi's own
# built-in curated boot-essential module list (storage/filesystem drivers)
# instead of everything.
#
# This only affects the INITRD. The base image's own KernelModules= is left
# unset/full deliberately, so the complete driver set stays available in the
# final booted system for detecting unknown hardware post-boot, per
# docs/SCOPE.md §6 - GPU/wifi/audio modules load on-demand from the real
# root well after the initrd's job is done.
[Content]
KernelInitrdModules=default

# nowatchdog: test VM has no /dev/kvm (nested virt unavailable, likely
# Hyper-V claiming VT-x on the Windows host), so qemu runs pure software
# emulation, slow enough to trip the kernel's soft-lockup hang detector as
# a false positive. This is scoped to [Runtime] (boot-test-only, injected
# via SMBIOS at qemu launch, not baked into the image's own UKI cmdline)
# specifically because real hardware won't have this problem — remove if
# nested virt or a real test machine becomes available. May turn out to be
# unnecessary once the initrd/UKI is no longer huge; left in for now.
[Runtime]
KernelCommandLineExtra=quiet loglevel=3 rw nowatchdog
